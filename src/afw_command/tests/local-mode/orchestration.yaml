# afw --local as single-threaded FCGI for authors (feed.kind action),
# plus raw feed.kind local for protocol / multi-directive sessions.
#
# Run: afwdev test --srcdir-pattern afw_command --test-pattern local-mode
# Optional leaf afw.conf is passed as afw -f (flags, adapters).

version: 1
description: afw --local — action-shaped + raw protocol sessions
host: local
timeout_s: 60

# Default looks like afwfcgi action feed (harness frames ++afw-local-mode-action)
feed:
  kind: action
  accept: application/json

tests:
  # --- High-level (same shape as FCGI action) ---
  - name: hello-print
    description: print + return under local action; expect and expect-stdout
    sourceType: script
    source: |
      print("Hello World!");
      return 42;
    expect: 42
    expect-stdout: Hello World!

  - name: arithmetic
    sourceType: script
    source: |
      assert((1 + 2) == 3);
      return 3;
    expect: 3

  # --- Raw protocol (escape hatch; historical local_test cases) ---
  - name: directives-switch
    description: >
      Multi-directive session (skipped until ignore ranges for times/UUIDs)
    skip: true
    feed:
      kind: local
    source: <<< inputs/case-1.bin
    expectResponse: <<< goldens/case-1.bin

  - name: evaluate-x-afw
    description: Raw local session with ACCEPT application/x-afw
    feed:
      kind: local
    source: <<< inputs/case-2.bin
    expectResponse: <<< goldens/case-2.bin

  - name: issue-71-env
    description: >
      Issue #71 env / multi-request properties (raw local protocol)
    feed:
      kind: local
    source: <<< inputs/case-3.bin
    expectResponse: <<< goldens/case-3.bin
