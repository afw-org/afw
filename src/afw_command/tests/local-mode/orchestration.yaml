# afw --local as single-threaded FCGI for authors (feed.kind action),
# plus raw feed.kind local for protocol sessions.
#
# Run: afwdev test --srcdir-pattern afw_command --test-pattern local-mode

version: 1
description: afw --local — action-shaped + raw protocol sessions
host: local
timeout_s: 60

feed:
  kind: action
  accept: application/json

tests:
  # --- High-level (same shape as FCGI action) ---
  - name: hello-print
    description: print + return under local action; expect and expect-stdout
    sourceType: script
    source: |
      print("Hello World!");
      return 42;
    expect: 42
    expect-stdout: Hello World!

  - name: arithmetic
    sourceType: script
    source: |
      assert((1 + 2) == 3);
      return 3;
    expect: 3

  - name: server-stable-fields
    description: >
      Server object via local action (replaces mega directives-switch check of
      _AdaptiveServer_ without asserting volatile startTime)
    sourceType: script
    source: |
      const s = get_object("afw", "_AdaptiveServer_", "current");
      assert(s !== null && s !== undefined, "missing server current");
      assert(s.threadCount !== null && s.threadCount !== undefined,
          "threadCount present");
      assert(s.threadCount >= 1, "threadCount >= 1");
      return true;

  - name: multi-request-props
    description: multi-request properties on local (via action + evaluate path)
    sourceType: script
    source: |
      // Set via perform is not multi-request props; validate request props shape
      const r = get_object("afw", "_AdaptiveRequestProperties_", "current");
      assert(r !== null && r !== undefined);
      assert(r.REQUEST_METHOD !== null && r.REQUEST_METHOD !== undefined);
      return r.REQUEST_METHOD;

  - name: test-script-expected-error
    description: >
      test_script under an action: an expect error test records its error
      with dest p the request's job heap (no scope above it)
    sourceType: test_script
    source: |
      #!/usr/bin/env -S afw --syntax test_script
      //?
      //? testScript: expected_error.as
      //? sourceType: script
      //?
      //? test: compile-error
      //? description: second let in a for init does not compile
      //? expect: error
      //? source: ...

      for (let i = 0, let j = 1; i < 1; i = i + 1) {
      }

      //?
      //? test: evaluate-error
      //? description: a throw at evaluate is an expected error too
      //? expect: error
      //? source: ...

      throw "expected";

  # --- Raw protocol (escape hatch) ---
  - name: evaluate-x-afw
    description: Raw local session with ACCEPT application/x-afw
    feed:
      kind: local
    source: <<< inputs/case-2.bin
    expect-raw-response: <<< goldens/case-2.bin

  - name: issue-71-env
    description: Issue #71 env / multi-request properties (raw local protocol)
    feed:
      kind: local
    source: <<< inputs/case-3.bin
    expect-raw-response: <<< goldens/case-3.bin
