/* Adaptive framework configuration. */
[
    // File adapter for accessing configuration.
    {
        type            : "adapter",
        adapterId       : "conf",
        adapterType     : "file",
        filenameSuffix  : ".json",
        contentType     : "json",
        root            : "/var/lib/afw/config/"
    },

    // Log messages of priority info and more severe to standard output.
    {
        type            : "log",
        logId           : "console",
        logType         : "standard",
        err             : true,
        warning         : true,
        notice          : true,
        info            : true
    },

    // catch all for /
    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    },

    {
        type            : "application",
        applicationId   : "MyApplication",
        title           : "My Application",
        confAdapterId   : "conf"
    }
]
