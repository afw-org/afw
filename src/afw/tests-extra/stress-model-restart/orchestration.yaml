# Restart adapter-model while other requests read through it.
# The model service lives in the conf adapter (startup immediate), so
# service_restart can load it again. adapter-afw is not touched.
# Opt-in: afwdev test -T src/afw/tests-extra/stress-model-restart
#
# The leaf fails if afwfcgi exits. Overlap the service layer already
# reports returns success. maxFail 0: any other request error fails.

version: 1
description: Restart adapter-model under concurrent reads
host: afwfcgi
afwfcgi:
  threads: "50%"
timeout_s: 90

feed:
  kind: action
  accept: application/json

tests:
  - name: read-model
    sourceType: script
    source: |
      try {
          const o = get_object("model", "Demo", "seed");
          assert(o.msg === "from-eval");
          assert(o.tag === "soak");
          return true;
      }
      catch (e) {
          if (includes<string>(e.message, "is not available")
              || includes<string>(e.message, "is not running")) {
              return "down";
          }
          throw e.message;
      }

  - name: restart-model
    sourceType: script
    source: |
      try {
          const svc = service_restart("adapter-model");
          assert(svc.serviceId === "adapter-model");
          assert(svc.status !== "error", string(svc.statusMessage));
          return svc.status;
      }
      catch (e) {
          if (includes<string>(e.message, "cannot be restarted")
              || includes<string>(e.message, "is not running")) {
              return "restarting";
          }
          throw e.message;
      }

  - name: stop-start-model
    sourceType: script
    source: |
      try {
          service_stop("adapter-model");
      }
      catch (e) {
          if (!includes<string>(e.message, "can not be stopped")
              && !includes<string>(e.message, "is not running")) {
              throw e.message;
          }
      }
      try {
          const svc = service_start("adapter-model");
          assert(svc.status !== "error", string(svc.statusMessage));
          return svc.status;
      }
      catch (e) {
          if (includes<string>(e.message, "can not be started")
              || includes<string>(e.message, "is not running")) {
              return "busy";
          }
          throw e.message;
      }

schedule:
  - firehose:
      duration_s: 30
      concurrency: "100%"
      clientProcesses: "50%"
      fromTests: [read-model, restart-model, stop-start-model]
      policy: random
      seed: 1
      stopOnError: false
      maxFail: 0
