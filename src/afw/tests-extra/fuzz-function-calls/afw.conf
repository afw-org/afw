/*
 * Freed chunks stay cached (large region cap, no trim), so an ASAN
 * build reports a stale read as use-after-poison instead of a SEGV
 * or a silent read.
 */
[
    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    },
    {
        type                : "application",
        applicationId       : "FuzzFunctionCallsLong",
        memoryRegionFreeListMaxBytes: 1073741824,
        memoryRegionKeepSmallCount: 1000000,
        memoryRegionKeepLargeCount: 1000000
    }
]
