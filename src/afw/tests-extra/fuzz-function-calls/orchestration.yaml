# Longer function-call fuzz (#485 part B). Ten minutes of requests from
# its own seed range; pair with --env-mode asan for a memory check:
#   ./afwdev test --env-mode asan -T src/afw/tests-extra/fuzz-function-calls
# A failure names the requests to replay with --replay SEED:FIRST-LAST.
# The gate version is src/afw/tests/advanced/fuzz-function-calls.
version: 1
description: Built-in functions called with odd arguments, ten minutes
host: afwfcgi
afwfcgi:
  threads: 16
timeout_s: 900
feed:
  kind: action
  accept: application/json
tests: []
schedule:
  - firehose:
      duration_s: 600
      concurrency: 16
      clientProcesses: 4
      seed: 1000
      maxFail: 0
      # Keep going after a crash: each exit is recorded (failures.log,
      # kept afwfcgi.*.exitN.log) and fails the leaf at the end.
      onServerExit: restart
      envModes:
        valgrind: { duration_s: 300, concurrency: 4, clientProcesses: 1 }
      fuzz:
        kind: functionCalls
        callsPerRequest: 25
