# Longer function-call fuzz (#485 part B). Ten minutes of requests from
# its own seed range; pair with --env-mode asan for a memory check:
#   ./afwdev test --env-mode asan -T src/afw/tests-extra/fuzz-function-calls
# A failure names the requests to replay with --replay SEED:FIRST-LAST;
# shrink one with --replay SEED:INDEX:shrink. Other seeds or a shorter
# run: --set seed=N --set duration_s=60.
# The gate version is src/afw/tests/advanced/fuzz-function-calls.
version: 1
description: Built-in functions called with odd arguments, ten minutes
host: afwfcgi
afwfcgi:
  threads: 16
timeout_s: 900
feed:
  kind: action
  accept: application/json
parameters:
  duration_s:
    default: 600
    valgrind: 300
    description: seconds of requests
  concurrency:
    default: 16
    valgrind: 4
    description: requests in flight
  clientProcesses:
    default: 4
    valgrind: 1
    description: client processes sending them
  seed: { default: 1000, description: "fuzz seed; request i comes from (seed, i)" }
tests: []
schedule:
  - firehose:
      duration_s: $duration_s
      concurrency: $concurrency
      clientProcesses: $clientProcesses
      seed: $seed
      maxFail: 0
      # Keep going after a crash: each exit is recorded (failures.log,
      # kept afwfcgi.*.exitN.log) and fails the leaf at the end.
      onServerExit: restart
      fuzz:
        kind: functionCalls
        callsPerRequest: 25
