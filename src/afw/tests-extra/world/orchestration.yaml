# World: one afwfcgi, several adapters, fake data, concurrent work.
# Opt-in: afwdev test -T src/afw/tests-extra/world
#
# Checked-in run is two minutes at half the CPUs. For a longer run,
# raise duration_s and timeout_s (timeout_s must stay above duration_s).
# Add adapters by dropping a service conf in conf/_AdaptiveServiceConf_/
# and a script in tests/. Keep adapter stop/restart out of this firehose
# until issue #382 is fixed.

version: 1
description: Busy afwfcgi with file data, one model, and the afw catalog
host: afwfcgi
afwfcgi:
  threads: "50%"
timeout_s: 180

feed:
  kind: action
  accept: application/json

tests:
  - name: generate
    sourceType: script
    source: <<< tests/generate.as
    expect: true

  - name: read-person
    sourceType: script
    source: <<< tests/read_person.as
    expect: true

  - name: read-note
    sourceType: script
    source: <<< tests/read_note.as
    expect: true

  - name: read-roster
    sourceType: script
    source: <<< tests/read_roster.as
    expect: true

  - name: read-generated
    sourceType: script
    source: <<< tests/read_generated.as
    expect: true

  - name: churn-note
    sourceType: script
    source: <<< tests/churn_note.as
    expect: true

  - name: churn-model
    sourceType: script
    source: <<< tests/churn_model.as
    expect: true

  - name: catalog
    sourceType: script
    source: <<< tests/catalog.as
    expect: true

schedule:
  - sequential:
      - generate
  - firehose:
      duration_s: 120
      concurrency: "100%"
      clientProcesses: "50%"
      fromTests:
        - read-person
        - read-note
        - read-roster
        - read-generated
        - churn-note
        - churn-model
        - catalog
      policy: random
      seed: 1
      stopOnError: false
      maxFail: 0
