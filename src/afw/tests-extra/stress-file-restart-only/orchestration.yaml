# Restart a plain file adapter while other requests read through it.
# Only service_restart. The stop-then-start mix lives in
# stress-file-restart and leaves the adapter with no active instance.
# Restart creates the new adapter, then swaps it in, so a read should
# still see the old instance or the new one.
# Opt-in: afwdev test -T src/afw/tests-extra/stress-file-restart-only
#
# The leaf fails if afwfcgi exits. Request errors are counted.
# Threads are 3 per CPU, with two requests in flight per thread.

version: 1
description: Restart a file adapter under concurrent reads
host: afwfcgi
afwfcgi:
  threads: "300%"
timeout_s: 120

feed:
  kind: action
  accept: application/json

tests:
  - name: read-file
    sourceType: script
    source: |
      const o = get_object("filebox", "Demo", "seed");
      assert(o.msg === "from-file");
      return true;

  - name: restart-file
    sourceType: script
    source: |
      try {
        const svc = service_restart("adapter-filebox");
        assert(svc.serviceId === "adapter-filebox");
        return svc.status;
      }
      catch (e) {
        if (includes<string>(e.message, "cannot be restarted")) {
          return "restarting";
        }
        throw e.message;
      }

schedule:
  - firehose:
      duration_s: 60
      concurrency: "200%"
      clientProcesses: "100%"
      fromTests: [read-file, restart-file]
      policy: random
      seed: 1
      stopOnError: false
