# Restart a plain file adapter while other requests read through it.
# Includes stop-then-start, which clears the active adapter before the
# next start. Restart-only is stress-file-restart-only.
# Same shape as stress-model-restart, without a model or location adapter.
# adapter-filebox is an immediate service in the conf adapter, so
# service_restart can load it again. adapter-afw and adapter-conf are
# not touched.
# Opt-in: afwdev test -T src/afw/tests-extra/stress-file-restart
#
# The leaf fails if afwfcgi exits. Overlap the service layer already
# reports returns success. maxFail 0: any other request error fails.
# Threads are 3 per CPU, with two requests in flight per thread.
# A percent may be over 100. One per CPU left this leaf near idle.

version: 1
description: Restart a file adapter under concurrent reads
host: afwfcgi
afwfcgi:
  threads: "300%"
timeout_s: 120

feed:
  kind: action
  accept: application/json

tests:
  - name: read-file
    sourceType: script
    source: |
      try {
          const o = get_object("filebox", "Demo", "seed");
          assert(o.msg === "from-file");
          return true;
      }
      catch (e) {
          if (includes<string>(e.message, "is not available")
              || includes<string>(e.message, "is not running")) {
              return "down";
          }
          throw e.message;
      }

  - name: restart-file
    sourceType: script
    source: |
      try {
        const svc = service_restart("adapter-filebox");
        assert(svc.serviceId === "adapter-filebox");
        return svc.status;
      }
      catch (e) {
        if (includes<string>(e.message, "cannot be restarted")) {
          return "restarting";
        }
        throw e.message;
      }

  - name: stop-start-file
    sourceType: script
    source: |
      try {
        service_stop("adapter-filebox");
      }
      catch (e) {
        if (!includes<string>(e.message, "can not be stopped")) {
          throw e.message;
        }
      }
      try {
        const svc = service_start("adapter-filebox");
        return svc.status;
      }
      catch (e) {
        if (includes<string>(e.message, "can not be started")) {
          return "busy";
        }
        throw e.message;
      }

schedule:
  - firehose:
      duration_s: 60
      concurrency: "200%"
      clientProcesses: "100%"
      fromTests: [read-file, restart-file, stop-start-file]
      policy: random
      seed: 1
      stopOnError: false
      maxFail: 0
