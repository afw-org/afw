#
# Note: exact function ids/arg shapes must match product; this is a shape test.

version: 1
description: Action feed calling a non-eval Adaptive function (shape sketch)

host: afwfcgi
afwfcgi:
  threads: 1
timeout_s: 60

feed:
  kind: action
  accept: application/json

tests:
  # Default path still works:
  - name: eval-path
    sourceType: script
    source: |
      return 1;
    expect: 1

  # Explicit function (illustrative — names may need adjusting when real):
  - name: retrieve-via-action
    feed:
      kind: action
      function: retrieve_objects
      # later: args map instead of sourceType/source
      # args:
