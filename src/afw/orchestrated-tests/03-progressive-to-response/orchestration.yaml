# Scenario: progressive retrieve_objects_to_response (#127 wire proof)
# Stresses: feed.accept application/x-afw, expectResponse exact body (<<< golden),
#           multi-object seed then progressive write path.

version: 1
description: Progressive to_response with Accept application/x-afw and body golden

host: afwfcgi
afwfcgi:
  threads: 1
timeout_s: 90

feed:
  kind: action
  accept: application/json

tests:
  - name: seed
    sourceType: script
    source: <<< tests/seed.as
    expect: true

  - name: progressive
    description: to_response needs Accept application/x-afw on the request
    feed:
      kind: action
      accept: application/x-afw
    sourceType: script
    source: <<< tests/to_response.as
    # return value may be undefined/void; judge the wire body
    expectResponse: <<< goldens/three_intermediates.xafw
    # later: decode: x-afw-payloads if we compare only JSON payloads

  - name: still-healthy
    sourceType: script
    source: <<< tests/count.as
    expect: 3

  - name: cleanup
    sourceType: script
    source: <<< tests/cleanup.as
    expect: true
