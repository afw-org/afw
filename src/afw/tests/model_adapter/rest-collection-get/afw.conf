/* Model adapter mapped on a file adapter, reached by REST. */
[
    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    },
    {
        type                : "application",
        applicationId       : "afw"
    },
    {
        adapterId           : "file",
        type                : "adapter",
        adapterType         : "file",
        root                : "objects/",
        filenameSuffix      : ".json",
        contentType         : "json",
        isModelLocation     : true
    },
    {
        adapterId               : "model",
        type                    : "adapter",
        adapterType             : "model",
        modelLocationAdapterId  : "file",
        modelId                 : "RestModel",
        mappedAdapterId         : "file"
    }
]
