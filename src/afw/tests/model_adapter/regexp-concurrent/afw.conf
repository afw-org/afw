/*
 * Script-only model whose onGetObject uses regexp literals (#585). The
 * script is compiled once into the adapter's multithreaded pool, so its
 * compiled regexps are shared by every request thread.
 */
[
    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    },
    {
        type                : "application",
        applicationId       : "afw"
    },
    {
        adapterId           : "file",
        type                : "adapter",
        adapterType         : "file",
        root                : "objects/",
        filenameSuffix      : ".json",
        contentType         : "json",
        isModelLocation     : true
    },
    {
        adapterId               : "model",
        type                    : "adapter",
        adapterType             : "model",
        modelLocationAdapterId  : "file",
        modelId                 : "RegexpModel"
    }
]
