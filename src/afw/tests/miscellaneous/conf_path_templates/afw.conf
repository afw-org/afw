// Issue #15: conf path templates evaluated at create with environment::
// AFW_ISSUE15_ROOT is set to the test work directory by config.py.
[
    {
        type                : "application",
        applicationId       : "conf-path-templates",
        rootFilePaths       : {
            // Host dir as template + full-path resolve at application start
            "data"          : "${environment::AFW_ISSUE15_ROOT}/files"
        },
        // Array of template module paths (plain soname still works)
        extensionModulePaths: [
            "libafwvfs"
        ]
    },
    {
        // File adapter root as template + full path at adapter start
        type                : "adapter",
        adapterType         : "file",
        adapterId           : "file",
        description         : "file adapter with template root (issue #15)",
        root                : "${environment::AFW_ISSUE15_ROOT}/objects/",
        filenameSuffix      : ".json",
        contentType         : "json"
    },
    {
        // Extension conf modulePath as template
        type                : "extension",
        extensionId         : "afw_yaml",
        modulePath          : "libafwyaml"
    }
]
