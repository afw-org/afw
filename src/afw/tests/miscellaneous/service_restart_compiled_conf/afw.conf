/*
 * Restart a file adapter whose conf compiled into the adapter pool,
 * with the region free list off so a released chunk is unmapped.
 */
[
    {
        type            : "adapter",
        adapterId       : "conf",
        adapterType     : "file",
        filenameSuffix  : ".json",
        contentType     : "json",
        root            : "config/"
    },
    {
        type            : "application",
        confAdapterId   : "conf",
        applicationId   : "RestartCompiledConf"
    }
]
