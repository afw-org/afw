[
    {
        type                            : "application",
        applicationId                   : "test-templates",
        description                     : "testing templates",
        rootFilePaths       : {
            "includes"      : "_includes",
        },
        "qualifiedVariables": {
            "app" : {
                "helloWorld" : "Hello World!",
                "compileTime" : "H#{'ello ' + 'Wor'}ld!",
                "evalTime" : "H${'ello ' + 'Wor'}ld!",
                "helloWorldFunction" : "#{\nfunction a() {return \"Hello World!\";}\n\nreturn a;\n}",
                "helloWorldFunctionArray" : "#{\nfunction a() {return \"Hello World!\";}\nfunction b() {return \"Same to you!\";}\nreturn [a,b];\n}",
                "helloWorldFunctionObject" : "#{\nfunction a() {return \"Hello World!\";}\nfunction b() {return \"Same to you!\";}\nreturn {'a':a,'b':b};\n}",
                "one" : 1, /* This is a string "1" because this is a template. */
                "two" : "#{1 + 1}",
                "three" : "${3}",
                "helloWorldLoadedFunction" : "#{return eval_from_file('includes/a.as');}",
                "uuidCompileTime" : "#{return generate_uuid();}",
                "uuidEvalTime" : "${return generate_uuid();}"
            }
        }
    }
]
