/*
 * A restart whose new instance fails to start throws, and the service
 * keeps running the previous instance (#525).
 */
[
    {
        type            : "adapter",
        adapterId       : "conf",
        adapterType     : "file",
        filenameSuffix  : ".json",
        contentType     : "json",
        root            : "config/"
    },
    {
        type            : "application",
        confAdapterId   : "conf",
        applicationId   : "RestartFails"
    }
]
