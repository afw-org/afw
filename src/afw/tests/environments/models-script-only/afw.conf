//
// Model adapter tests without mappedAdapterId (issue #109).
// File adapter is only the model location; data is pure on* script.
//
[
    {
        type                : "application",
        applicationId       : "model-script-only-tests",
        rootFilePaths       : {
            "includes"      : "includes"
        }
    },

    {
        adapterId           : "file",
        type                : "adapter",
        adapterType         : "file",
        root                : "objects/",
        filenameSuffix      : ".json",
        contentType         : "json",
        isModelLocation     : true
    },

    {
        adapterId               : "scriptModel",
        type                    : "adapter",
        adapterType             : "model",
        modelLocationAdapterId  : "file",
        modelId                 : "ScriptOnlyModel"
        // no mappedAdapterId — pure-script model (issue #109)
    }
]
