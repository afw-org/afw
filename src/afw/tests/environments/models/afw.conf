//
// This is the adaptive framework configuration for tests that need 
// access to:
//
//     file adapter ("file")
//     generate objects ("dev")
//     model adapter ("model")
//
[
    {
        type                : "application",
        applicationId       : "model-tests",
        rootFilePaths       : {
            "includes"      : "includes"
        }
    },

    {
        adapterId           : "file",
        type                : "adapter",
        adapterType         : "file",
        root                : "objects/",
        filenameSuffix      : ".json",
        contentType         : "json",
        isModelLocation     : true
    },

    {
        adapterId               : "model",
        type                    : "adapter",
        adapterType             : "model",
        modelLocationAdapterId  : "file",
        modelId                 : "TestModel1",
        mappedAdapterId         : "file"
    }
]

