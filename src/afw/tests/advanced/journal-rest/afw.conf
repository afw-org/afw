/*
 * A file journal reached over REST (see orchestration.yaml).
 */
[
    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    },
    {
        type                : "adapter",
        adapterType         : "file",
        adapterId           : "journal",
        description         : "file journal in the leaf work directory",
        root                : "journal/",
        filenameSuffix      : ".json",
        contentType         : "json"
    }
]
