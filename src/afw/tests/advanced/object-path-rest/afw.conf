/*
 * A file adapter reached over REST (see orchestration.yaml).
 */
[
    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    },
    {
        type                : "adapter",
        adapterType         : "file",
        adapterId           : "files",
        description         : "file adapter in the leaf work directory",
        root                : "files/",
        filenameSuffix      : ".json",
        contentType         : "json"
    }
]
