version: 1
description: >
  Multi-eval on one afwfcgi: repeated registry/catalog reads stay healthy
host: afwfcgi
afwfcgi:
  threads: 1
timeout_s: 120
feed:
  kind: action
  accept: application/json
tests:
  - name: first catalog retrieve
    sourceType: script
    source: |
      const types = retrieve_objects(
          "afw", "_AdaptiveObjectType_",
          undefined, undefined, undefined, 0);
      assert(length(types) > 0, "expected at least one object type");
      return length(types);
  - name: second catalog retrieve
    sourceType: script
    source: |
      const types = retrieve_objects(
          "afw", "_AdaptiveObjectType_",
          undefined, undefined, undefined, 0);
      assert(length(types) > 0);
      return length(types);
  - name: eval burst 1
    sourceType: script
    source: |
      let i: integer = 0;
      let sum: integer = 0;
      for (i = 0; i < 50; i = i + 1)
          sum = sum + i;
      assert(sum == 1225);
      return sum;
    expect: 1225
  - name: eval burst 2
    sourceType: script
    source: |
      let i: integer = 0;
      let sum: integer = 0;
      for (i = 0; i < 50; i = i + 1)
          sum = sum + i;
      assert(sum == 1225);
      return sum;
    expect: 1225
  - name: test_script sanity
    sourceType: test_script
    sourcePath: step_registry_sane.as
