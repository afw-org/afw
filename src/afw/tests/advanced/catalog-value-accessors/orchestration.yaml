version: 1
description: >
  Multi-request #149: value accessor catalog and adapter afw anchor
  across sequential FCGI evals on one afwfcgi
host: afwfcgi
afwfcgi:
  threads: 1
timeout_s: 90
feed:
  kind: action
  accept: application/json
tests:
  - name: retrieve value accessor catalog
    sourceType: script
    sourcePath: retrieve_accessors.as
  - name: get stopping_adapter_instances entry
    sourceType: script
    sourcePath: get_stopping.as
  - name: get adapter_reference_count entry
    sourceType: script
    sourcePath: get_adapter_rc_entry.as
  - name: adapter afw referenceCount (same process)
    sourceType: script
    sourcePath: adapter_afw_rc.as
  - name: second request re-read catalog
    sourceType: script
    sourcePath: second_catalog_read.as
  - name: test_script hybrid step
    sourceType: test_script
    sourcePath: step_catalog_sane.as
