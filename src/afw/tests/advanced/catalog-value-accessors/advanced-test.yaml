# =============================================================================
# *** Experimental *** advanced-test (issue #157) — may change; see
# designs/afwdev-advanced-test.md
# #149 runtime value accessor catalog + adapter anchor (multi-request)
# =============================================================================
# What this shows that one-shot `afw -x` cannot:
#   - One long-lived afwfcgi for several independent catalog reads
#   - Contracts on _AdaptiveRuntimeValueAccessor_ and _AdaptiveAdapter_
#     (copiesUnderLock, referenceCount) stay healthy across requests
#
# Run (package root, after install):
#   ./afwdev test --test-pattern catalog-value-accessors --show-all
# Blast thrash (not this leaf):
#   afwdev blast -T src/afw/tests_special/catalog -d 15s -m 50
# =============================================================================

host: afwfcgi

description: >
  Multi-request #149: value accessor catalog and adapter afw anchor
  across sequential FCGI evals on one afwfcgi

afwfcgi:
  threads: 1

timeout_s: 90

steps:
  - name: retrieve value accessor catalog
    eval: |
      // maxObjects is 6th arg; 0 = unlimited (#49)
      const list = retrieve_objects(
          "afw",
          "_AdaptiveRuntimeValueAccessor_",
          {},
          undefined,
          undefined,
          0);
      assert(length(list) >= 20, "expected core value accessors");
      let foundDefault = false;
      let lockCopy = 0;
      for (const e of list) {
          if (e.key === "default") {
              foundDefault = true;
              assert(e.brief !== null && e.brief !== undefined);
              assert(e.returnsLiveReference === true,
                  "default should return live reference");
          }
          if (e.copiesUnderLock === true)
              lockCopy = lockCopy + 1;
      }
      assert(foundDefault, "missing default accessor");
      assert(lockCopy >= 2, "expected at least stopping_* lock-copy accessors");
      return length(list);

  - name: get stopping_adapter_instances entry
    eval: |
      const o = get_object(
          "afw",
          "_AdaptiveRuntimeValueAccessor_",
          "stopping_adapter_instances");
      assert(o.key === "stopping_adapter_instances");
      assert(o.copiesUnderLock === true);
      assert(o.returnsLiveReference === false);
      return o.key;

  - name: get adapter_reference_count entry
    eval: |
      const o = get_object(
          "afw",
          "_AdaptiveRuntimeValueAccessor_",
          "adapter_reference_count");
      assert(o.key === "adapter_reference_count");
      assert(o.copiesUnderLock === true);
      return o.brief;

  - name: adapter afw referenceCount (same process)
    eval: |
      const a = get_object("afw", "_AdaptiveAdapter_", "afw");
      assert(a.adapterId === "afw");
      assert(a.referenceCount !== null && a.referenceCount !== undefined);
      assert(a.referenceCount >= 1, "active adapter should have refcount >= 1");
      // metrics is live-while-active when adapter is up
      assert(a.metrics !== null && a.metrics !== undefined,
          "metrics present while adapter active");
      return a.referenceCount;

  - name: second request re-read catalog
    eval: |
      // Second request xctx — catalog still serves full objects
      const o = get_object(
          "afw",
          "_AdaptiveRuntimeValueAccessor_",
          "adapter_metrics");
      assert(o.key === "adapter_metrics");
      assert(o.returnsLiveReference === true);
      assert(o.copiesUnderLock === false);
      return o.key;

  - name: test_script hybrid step
    script: step_catalog_sane.as
