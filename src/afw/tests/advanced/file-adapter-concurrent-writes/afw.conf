/*
 * A file adapter rooted in this leaf's work directory, written by many
 * requests at once (see orchestration.yaml).
 */
[
    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    },
    {
        type                : "adapter",
        adapterType         : "file",
        adapterId           : "file",
        description         : "file adapter in the leaf work directory",
        root                : "objects/",
        filenameSuffix      : ".json",
        contentType         : "json"
    }
]
