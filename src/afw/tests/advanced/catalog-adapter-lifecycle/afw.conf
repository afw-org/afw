/* Hermetic conf: conf adapter so service_start can re-create services (#149). */
[
    // Conf store first — service start reads _AdaptiveServiceConf_ from here
    {
        type            : "adapter",
        adapterType     : "file",
        adapterId       : "conf",
        description     : "Conf objects for service start/stop",
        root            : "conf/",
        filenameSuffix  : ".json",
        contentType     : "json"
    },

    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    },

    // Binds conf_adapter so service_start works after stop
    {
        type            : "application",
        confAdapterId   : "conf",
        applicationId   : "CatalogLifecycle"
    }
]
