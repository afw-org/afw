# Built-in functions called with odd arguments (#485 part B): each
# request is a script of 25 try-wrapped calls, built from the server's
# own function list and the fixed seed, so every run sends the same
# requests. A crash, sanitizer report, or error escaping a try fails
# the leaf and names the requests to replay:
#   afwdev test -T src/afw/tests/advanced/fuzz-function-calls --replay 1:INDEX
# Shrink one failing request: --replay 1:INDEX:shrink.
# Another seed or size: --set seed=7, --set maxRequests=2000.
# Longer runs with other seeds: src/afw/tests-extra/fuzz-function-calls.
version: 1
description: Built-in functions called with odd arguments
host: afwfcgi
afwfcgi:
  threads: 8
timeout_s: 600
feed:
  kind: action
  accept: application/json
parameters:
  maxRequests:
    default: 400
    valgrind: 50
    description: requests to send (valgrind runs one afwfcgi thread at a time)
  concurrency: { default: 8, description: "requests in flight" }
  seed: { default: 1, description: "fuzz seed; request i comes from (seed, i)" }
tests: []
schedule:
  - firehose:
      maxRequests: $maxRequests
      concurrency: $concurrency
      seed: $seed
      maxFail: 0
      fuzz:
        kind: functionCalls
        callsPerRequest: 25
