# Odd FastCGI requests (#485 step 5): each request comes from
# fuzz_hostile_pieces.build() with the fixed seed, so every run sends
# the same requests. Any HTTP status is a fine answer; a crash,
# sanitizer report, hang, or a reply without a FastCGI end record or
# status line fails the leaf and names the requests to replay:
#   afwdev test -T src/afw/tests/advanced/fuzz-hostile --replay 1:INDEX
# Another seed or size: --set seed=7, --set maxRequests=2000.
# Longer runs: src/afw/tests-extra/fuzz-hostile.
version: 1
description: Odd FastCGI requests answered without a crash or hang
host: afwfcgi
afwfcgi:
  threads: 8
timeout_s: 600
feed:
  kind: action
  accept: application/json
parameters:
  maxRequests:
    default: 400
    valgrind: 50
    description: requests to send (valgrind runs one afwfcgi thread at a time)
  concurrency: { default: 8, description: "requests in flight" }
  seed: { default: 1, description: "fuzz seed; request i comes from (seed, i)" }
tests: []
schedule:
  - firehose:
      maxRequests: $maxRequests
      concurrency: $concurrency
      seed: $seed
      maxFail: 0
      fuzz:
        kind: hostile
        requestTimeout_s: 30
