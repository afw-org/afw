/*
 * Only the runtime afw adapter and a file adapter rooted in this leaf's
 * work directory, so whatever a hostile request writes stays in the run.
 */
[
    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    },
    {
        type                : "adapter",
        adapterType         : "file",
        adapterId           : "data",
        description         : "file adapter in the leaf work directory",
        root                : "objects/",
        filenameSuffix      : ".json",
        contentType         : "json"
    },
    {
        type                : "application",
        applicationId       : "FuzzHostile"
    }
]
