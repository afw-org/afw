/* Hermetic afwfcgi: low eval-stack cap so one request trips, next still serves. */
[
    {
        type                : "application",
        applicationId       : "payload-too-large-worker",
        limitEvaluationStackCount: 40
    },
    {
        type                : "requestHandler",
        uriPrefix           : "/",
        requestHandlerType  : "adapter"
    }
]
