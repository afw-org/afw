/*
 * Journal resource ids (#520): the built-in and the REST form of a journal
 * operation are checked on the same path, the special objectId of the REST
 * form without its limit. This handler permits only the journal paths and
 * actions listed in allowed (and everything that is not a journal entry).
 */
[
    {
        type                        : "authorizationHandler",
        authorizationHandlerType    : "script",
        authorizationHandlerId      : "auth-script",
        allowDenyOverride           : false,
        description                 : "Permit only listed journal entry paths",
        qualifiedVariables          : {},
        authorizationCheck          : "const j = '/journal/_AdaptiveJournalEntry_/'; const allowed = { ['create ' + j]: true, ['read ' + j + 'get_first']: true, ['read ' + j + '1']: true, ['read ' + j + 'get_next_after_cursor:1']: true, ['read ' + j + 'get_next_for_consumer:p']: true, ['read ' + j + 'get_next_for_consumer_after_cursor:p:1']: true, ['read ' + j + 'advance_cursor_for_consumer:p']: true, ['modify ' + j + 'mark_consumed:p:1']: true }; return {decisionId: (!starts_with(current::resourceId, j) || property_exists(allowed, current::actionId + ' ' + current::resourceId)) ? 'permit' : 'deny'};"
    },
    {
        adapterId           : "journal",
        type                : "adapter",
        adapterType         : "file",
        root                : "journal/",
        filenameSuffix      : ".json",
        contentType         : "json"
    }
]
