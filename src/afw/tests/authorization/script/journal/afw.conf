/*
 * Journal operations are authorized like object operations, on path
 * /<adapter>/_AdaptiveJournalEntry_/<cursor or special objectId>. This
 * handler denies every journal entry operation on "journal" and permits
 * everything else.
 */
[
    {
        type                        : "authorizationHandler",
        authorizationHandlerType    : "script",
        authorizationHandlerId      : "auth-script",
        allowDenyOverride           : false,
        description                 : "Deny journal entries",
        qualifiedVariables          : {},
        authorizationCheck          : "return {decisionId: starts_with(current::resourceId, '/journal/_AdaptiveJournalEntry_/') ? 'deny' : 'permit'};"
    },
    {
        adapterId           : "journal",
        type                : "adapter",
        adapterType         : "file",
        root                : "journal/",
        filenameSuffix      : ".json",
        contentType         : "json"
    },
    {
        adapterId           : "file",
        type                : "adapter",
        adapterType         : "file",
        root                : "objects/",
        filenameSuffix      : ".json",
        contentType         : "json",
        journalAdapterId    : "journal"
    }
]
