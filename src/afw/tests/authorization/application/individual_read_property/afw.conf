[
    {
        type                            : "application",
        applicationId                   : "test-individual-read-property",
        description                     : "read deny based on object body when checkIndividual true",
        authorizationControl            : {
            initialAuthorizationCheck   : "const actionId = current::actionId;\nconst object = current::object;\nif (actionId === \"read\") {\n    const secret = property_get(object, \"secret\");\n    if (secret === \"s1\") {\n        return { decisionId: \"deny\", description: \"secret s1 denied\" };\n    }\n}\nreturn { decisionId: \"permit\" };"
        }
    },
    {
        adapterId                       : "data",
        type                            : "adapter",
        adapterType                     : "file",
        root                            : "./objects",
        filenameSuffix                  : ".json",
        contentType                     : "json",
        checkIndividualObjectReadAccess : true
    }
]
