//
// This is the adaptive framework configuration for vfs tests
//
[
    // vfs adapter used by tests
    {
        "adapterId": "vfs",
        "type": "adapter",
        "title": "VFS for accessible files",
        "adapterType": "vfs",
        "vfsMap": [
            "=./"
        ],
        "markExecutable":[
            "*.as"
        ]
    },
    // Small maxReadBytes for limit tests
    {
        "adapterId": "vfs_small",
        "type": "adapter",
        "title": "VFS with small maxReadBytes",
        "adapterType": "vfs",
        "vfsMap": [
            "=./"
        ],
        "maxReadBytes": 16
    },
    // Multi-entry vfsMap (longest-prefix / path-boundary cases like rootFilePaths)
    {
        "adapterId": "vfs_multi",
        "type": "adapter",
        "title": "VFS multi-map",
        "adapterType": "vfs",
        "vfsMap": [
            "includes/=./multi/includes_root/",
            "include/=./multi/include_root/",
            "data/=./multi/data_root/"
        ]
    }
]
