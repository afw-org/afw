//
// This is the adaptive framework configuration for vfs tests
//
// AFW_VFS_TEST_ROOT is set to the test work directory by config.py (issue #15).
//
[
    // vfs adapter used by tests
    {
        "adapterId": "vfs",
        "type": "adapter",
        "title": "VFS for accessible files",
        "adapterType": "vfs",
        "vfsMap": [
            "=${environment::AFW_VFS_TEST_ROOT}/"
        ],
        "markExecutable":[
            "*.as"
        ]
    },
    // Small maxReadBytes for limit tests
    {
        "adapterId": "vfs_small",
        "type": "adapter",
        "title": "VFS with small maxReadBytes",
        "adapterType": "vfs",
        "vfsMap": [
            "=${environment::AFW_VFS_TEST_ROOT}/"
        ],
        "maxReadBytes": 16
    },
    // Multi-entry vfsMap (longest-prefix / path-boundary cases like rootFilePaths)
    {
        "adapterId": "vfs_multi",
        "type": "adapter",
        "title": "VFS multi-map",
        "adapterType": "vfs",
        "vfsMap": [
            "includes/=${environment::AFW_VFS_TEST_ROOT}/multi/includes_root/",
            "include/=${environment::AFW_VFS_TEST_ROOT}/multi/include_root/",
            "data/=${environment::AFW_VFS_TEST_ROOT}/multi/data_root/"
        ]
    }
]
