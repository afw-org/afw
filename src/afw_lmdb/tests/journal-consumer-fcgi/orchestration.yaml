# An LMDB adapter journaled to another LMDB adapter (journalAdapterId),
# each its own environment: data and journal. Every journaled write
# takes data, then journal (the entry is written after the object). A
# journal consumer takes them the other way: journal_get_next_for_consumer
# writes the consumer's state in journal, then applying the entry writes
# data. A consumer and a writer that overlap would each hold one
# environment's writer mutex and wait for the other's. Before the LMDB
# wait graph that hung the server; now the request that would close the
# cycle (here the consumer) gets "would deadlock" and can be retried.
#
# The two requests signal each other through the file adapter "signals"
# (no transactions, so a write is seen at once): the consumer holds
# journal before the writer starts, and the writer starts before the
# consumer reaches for data. The writer cannot signal from inside its
# write (data, then waiting for journal), so the consumer gives it 2s.
version: 1
description: LMDB journal consumer and a journaled writer in opposite environment order
host: afwfcgi
afwfcgi:
  threads: 4
timeout_s: 60
parameters:
  opposite_order_skip:
    default: false
    tsan: true
    description: >-
      Skip the steps that write two LMDB environments in opposite orders.
      TSan reports that lock order (two LMDB writer mutexes) even though
      the LMDB write wait graph refuses the wait that would close the
      cycle; expected, see beta-backlog.md (TSan findings).

feed:
  kind: action
  accept: application/json
tests:
  - name: setup
    description: A consumer (peer) in journal, and one journaled write for it to find.
    sourceType: script
    source: |
      add_object("journal", "_AdaptiveProvisioningPeer_", {peerId: "consumer1"},
          "6f1c2d3e-0000-4000-8000-000000000001");
      add_object("lmdb", "_AdaptiveObject_", {n: 0}, "seed");
      return true;
    expect: true

  - name: consumer
    description: >-
      Journal first (get_next_for_consumer), then data (apply the entry).
      Signals that it holds journal, waits for the writer's signal that
      it is about to write, gives that write 2s to take data and wait for
      journal, then writes data: refused.
    skip: $opposite_order_skip
    sourceType: script
    source: |
      function waitFor(signal: string): void {
          const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT120S"));
          // A body of its own: each try's allocations are freed with it.
          while (true) {
              let found: boolean = false;
              try { get_object("signals", "Signal", signal); found = true; }
              catch (e) { }
              if (found) { break; }
              const now = now_utc();
              if (now >= until) { throw "timed out waiting for " + signal; }
          }
      }
      const peer = "6f1c2d3e-0000-4000-8000-000000000001";
      const next = journal_get_next_for_consumer("journal", peer, 10);
      assert(is_defined(next.entryCursor), "no entry for the consumer");
      add_object("signals", "Signal", {}, "consumer-holds-journal");
      waitFor("writer-writing");
      // Give the writer 2s. Each pass reads a file, a system call: under
      // valgrind a loop without one can keep the writer's thread from
      // running at all.
      const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT2S"));
      while (true) {
          try { get_object("signals", "Signal", "never"); } catch (e) { }
          const now = now_utc();
          if (now >= until) { break; }
      }
      try {
          add_object("lmdb", "_AdaptiveObject_", {applied: next.entryCursor}, "applied");
          journal_mark_consumed("journal", peer, next.entryCursor);
      }
      catch (e) {
          assert(includes<string>(e.message, "would deadlock"), e.message);
          return "refused";
      }
      return "applied";
    expect: refused

  - name: writer
    description: >-
      Waits for the consumer's signal that it holds journal, signals, then
      writes data and its journal entry: waits for the consumer, then lands.
    skip: $opposite_order_skip
    sourceType: script
    source: |
      function waitFor(signal: string): void {
          const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT120S"));
          // A body of its own: each try's allocations are freed with it.
          while (true) {
              let found: boolean = false;
              try { get_object("signals", "Signal", signal); found = true; }
              catch (e) { }
              if (found) { break; }
              const now = now_utc();
              if (now >= until) { throw "timed out waiting for " + signal; }
          }
      }
      waitFor("consumer-holds-journal");
      add_object("signals", "Signal", {}, "writer-writing");
      add_object("lmdb", "_AdaptiveObject_", {n: 1}, "w1");
      return true;
    expect: true

  - name: consumer-retry
    description: The retry, with nothing in its way, applies the entry and marks it consumed.
    skip: $opposite_order_skip
    sourceType: script
    source: |
      const peer = "6f1c2d3e-0000-4000-8000-000000000001";
      const next = journal_get_next_for_consumer("journal", peer, 10);
      assert(is_defined(next.entryCursor), "no entry for the consumer");
      add_object("lmdb", "_AdaptiveObject_", {applied: next.entryCursor}, "applied");
      journal_mark_consumed("journal", peer, next.entryCursor);
      return true;
    expect: true

  - name: check
    description: The writer's object, the applied marker, and no "applied" from the refused try.
    skip: $opposite_order_skip
    sourceType: script
    source: |
      return [get_object("lmdb", "_AdaptiveObject_", "w1").n,
          is_defined(get_object("lmdb", "_AdaptiveObject_", "applied").applied)];
    expect: [1, true]

schedule:
  - sequential: [setup]
  - parallel:
      n: 2
      tests: [consumer, writer]
  - sequential: [consumer-retry, check]
