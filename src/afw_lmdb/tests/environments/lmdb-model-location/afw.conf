[
    // lmdb adapter hosting _AdaptiveModel_/_AdaptiveObjectType_ objects
    // directly, via isModelLocation, instead of a separate file adapter.
    {
        "adapterId": "lmdb",
        "type": "adapter",
        "title": "LMDB as a model location",
        "adapterType": "lmdb",
        "isModelLocation": true,
        "limits": {
            "time": {
                "hard": 14400,
                "soft": 3600
            },
            "size": {
                "hard": 1000,
                "soft": 500
            }
        },
        "env": {
            "mapsize": 104857600,
            "maxdbs": 128,
            "maxreaders": 126,
            "mode": 384,
            "path": "${environment::AFW_LMDB_TEST_PATH}"
        }
    }
]
