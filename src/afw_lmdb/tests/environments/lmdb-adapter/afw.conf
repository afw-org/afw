[
    // lmdb adapter used by all tests
    {
        "adapterId": "lmdb",
        "type": "adapter",
        "title": "LMDB for testing",
        "adapterType": "lmdb",
        "limits":{
            "time":{
                "hard":14400,
                "soft":3600
            },
            "size":{
                "hard":1000,
                "soft":500
            }
        },
        "index": {
            // Issue #298: pinned to "probe" (not the default "totalEntries")
            // so index_cardinality_probe_trace.py can exercise the probe
            // strategy specifically. cardinalityProbeCap is deliberately
            // small so tests can prove both the exact-count and
            // capped-estimate branches with a handful of objects, and prove
            // the configured value (not the built-in default of 100) is
            // what's actually used. Neither setting affects which objects a
            // query returns -- only OR/AND cursor-merge ordering.
            "cardinalityStrategy": "probe",
            "cardinalityProbeCap": 5
        },
        "env": {
            "mapsize":104857600,
            "maxdbs":128,
            "maxreaders":126,
            "mode":384,
            "path":"${environment::AFW_LMDB_TEST_PATH}"
        }
    }
]

