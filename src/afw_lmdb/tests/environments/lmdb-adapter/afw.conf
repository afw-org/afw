[
    // lmdb adapter used by all tests
    {
        "adapterId": "lmdb",
        "type": "adapter",
        "title": "LMDB for testing",
        "adapterType": "lmdb",
        "limits":{
            "time":{
                "hard":14400,
                "soft":3600
            },
            "size":{
                "hard":1000,
                "soft":500
            },
            // Deliberately small (issue #298): lets tests prove both the
            // exact-count and capped-estimate branches of the adapter-index
            // cardinality probe with a handful of objects, and proves the
            // configured value (not the built-in default of 100) is what's
            // actually used. Only affects OR/AND cursor-merge ordering
            // (a performance hint), never which objects a query returns.
            "cardinalityProbeCap": 5
        },
        "env": {
            "mapsize":104857600,
            "maxdbs":128,
            "maxreaders":126,
            "mode":384,
            "path":"${environment::AFW_LMDB_TEST_PATH}"
        }
    }
]

