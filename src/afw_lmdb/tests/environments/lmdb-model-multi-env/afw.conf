[
    // Two LMDB environments (lmdbA, lmdbB), a second adapter id on
    // lmdbA's directory (lmdbA2, spelled without the trailing slash so
    // the shared-env lookup has to normalize it), and a model mapped to
    // lmdbA whose on* scripts also use lmdbB and lmdbA2.
    {
        "adapterId": "file",
        "type": "adapter",
        "adapterType": "file",
        "root": "objects/",
        "filenameSuffix": ".json",
        "contentType": "json",
        "isModelLocation": true
    },

    {
        "adapterId": "lmdbA",
        "type": "adapter",
        "title": "LMDB env A: the model's mapped adapter",
        "adapterType": "lmdb",
        "limits": {
            "time": { "hard": 14400, "soft": 3600 },
            "size": { "hard": 1000, "soft": 500 }
        },
        "env": {
            "mapsize": 104857600,
            "maxdbs": 128,
            "maxreaders": 126,
            "mode": 384,
            "path": "./lmdbA/"
        }
    },

    {
        "adapterId": "lmdbB",
        "type": "adapter",
        "title": "LMDB env B: used from model on* scripts",
        "adapterType": "lmdb",
        "limits": {
            "time": { "hard": 14400, "soft": 3600 },
            "size": { "hard": 1000, "soft": 500 }
        },
        "env": {
            "mapsize": 104857600,
            "maxdbs": 128,
            "maxreaders": 126,
            "mode": 384,
            "path": "./lmdbB/"
        }
    },

    {
        "adapterId": "lmdbA2",
        "type": "adapter",
        "title": "Second adapter id on lmdbA's directory: shares its MDB_env",
        "adapterType": "lmdb",
        "limits": {
            "time": { "hard": 14400, "soft": 3600 },
            "size": { "hard": 1000, "soft": 500 }
        },
        "env": {
            "mapsize": 104857600,
            "maxdbs": 128,
            "maxreaders": 126,
            "mode": 384,
            "path": "./lmdbA"
        }
    },

    {
        "adapterId": "model",
        "type": "adapter",
        "adapterType": "model",
        "modelLocationAdapterId": "file",
        "modelId": "MultiEnv",
        "mappedAdapterId": "lmdbA"
    }
]
