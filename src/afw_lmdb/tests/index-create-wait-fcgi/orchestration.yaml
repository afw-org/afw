# index_create while other writes hold LMDB environments.
#
# index_create opens the index's database before it begins its own
# transaction. That open used to take the environment's dbLock exclusive,
# which waits for every open transaction on that environment, and the
# write wait graph could not see that wait:
#
#   alias-then-index-create: one request writes through lmdbA2, then
#   index_create on lmdbA (same directory, same MDB_env). The exclusive
#   lock waited on this request's own read hold: hung forever.
#
#   indexer / holder: holder writes lmdbB, then (a second later) lmdbA;
#   indexer writes lmdbA, then index_create on lmdbB. indexer waited for
#   holder's lmdbB transaction to end, holder for indexer's lmdbA writer:
#   deadlock, every later request on either environment queued behind.
#
# With dbLock gone, the index open is an ordinary write on lmdbB that the
# wait graph sees: the alias case is refused at once, and in the pair the
# holder (whose wait closes the cycle) is refused and indexer finishes.
#
# The pair signal each other through the file adapter "signals" (no
# transactions, so a write is seen at once), so they overlap however slow
# the run; indexer cannot signal from inside index_create, so holder gives
# it 2s to start waiting on lmdbB.
version: 1
description: LMDB index_create against writes that hold environments
host: afwfcgi
afwfcgi:
  threads: 4
timeout_s: 60
feed:
  kind: action
  accept: application/json
tests:
  - name: alias-then-index-create
    description: Write through lmdbA2, then index_create on lmdbA, in one request. Refused.
    sourceType: script
    source: |
      add_object("lmdbA2", "Row", {k: "a"}, "a1");
      try {
          index_create("lmdbA", "k", undefined, ["Row"], undefined, undefined, false, false);
      }
      catch (e) {
          assert(includes<string>(e.message, "would deadlock"), e.message);
          return "refused";
      }
      return "created";
    expect: refused

  - name: indexer
    description: >-
      lmdbA first; once holder signals that it holds lmdbB, signals and
      calls index_create on lmdbB, which waits for holder's request.
    sourceType: script
    source: |
      function waitFor(signal: string): void {
          const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT120S"));
          // A body of its own: each try's allocations are freed with it.
          while (true) {
              let found: boolean = false;
              try { get_object("signals", "Signal", signal); found = true; }
              catch (e) { }
              if (found) { break; }
              const now = now_utc();
              if (now >= until) { throw "timed out waiting for " + signal; }
          }
      }
      add_object("lmdbA", "Row", {k: "x"}, "x1");
      waitFor("holder-holds-b");
      add_object("signals", "Signal", {}, "indexer-indexing");
      // Retroactive: the scan runs once holder's request has ended, so
      // it indexes holder's committed row too.
      index_create("lmdbB", "k", undefined, ["Row"], undefined, undefined, true, false);
      return "created";
    expect: created

  - name: holder
    description: >-
      lmdbB first and signals; once indexer signals, gives index_create
      2s to start waiting on lmdbB, then writes lmdbA. Refused.
    sourceType: script
    source: |
      function waitFor(signal: string): void {
          const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT120S"));
          // A body of its own: each try's allocations are freed with it.
          while (true) {
              let found: boolean = false;
              try { get_object("signals", "Signal", signal); found = true; }
              catch (e) { }
              if (found) { break; }
              const now = now_utc();
              if (now >= until) { throw "timed out waiting for " + signal; }
          }
      }
      add_object("lmdbB", "Row", {k: "h"}, "h1");
      add_object("signals", "Signal", {}, "holder-holds-b");
      waitFor("indexer-indexing");
      // Each pass reads a file, a system call: under valgrind a loop
      // without one can keep indexer's thread from running at all.
      const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT2S"));
      while (true) {
          try { get_object("signals", "Signal", "never"); } catch (e) { }
          const now = now_utc();
          if (now >= until) { break; }
      }
      try {
          add_object("lmdbA", "Row", {k: "h"}, "h2");
      }
      catch (e) {
          assert(includes<string>(e.message, "would deadlock"), e.message);
          return "refused";
      }
      return "written";
    expect: refused

  - name: check
    description: >-
      The index on lmdbB finds holder's row (indexed retroactively) and a
      row added since; both environments still take writes.
    sourceType: script
    source: |
      add_object("lmdbA", "Row", {k: "y"}, "y1");
      add_object("lmdbB", "Row", {k: "h"}, "h3");
      const found = retrieve_objects("lmdbB", "Row", {filter: {op: "eq", property: "k", value: "h"}});
      return [length(found), is_defined(index_list("lmdbB"))];
    expect: [2, true]

schedule:
  - sequential: [alias-then-index-create]
  - parallel:
      n: 2
      tests: [indexer, holder]
  - sequential: [check]
