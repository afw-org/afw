# Concurrent requests across two LMDB environments, lmdbA (the model's
# mapped adapter) and lmdbB (written by Order's onAddObject), plus
# lmdbA2, a second adapter id on lmdbA's directory (shared MDB_env).
#
# A request's write transaction on an environment holds that
# environment's writer mutex from first write until the request ends.
# Requests that take lmdbA then lmdbB (every model add) queue behind each
# other and all land. A request that takes lmdbB first and then lmdbA,
# while another takes lmdbA then lmdbB, would deadlock; the LMDB adapter
# refuses the write that closes the cycle with "would deadlock" (EDEADLK)
# instead. Before that, every afwfcgi thread blocked and the server hung.
#
# Request-boundary cases: ../model-multi-env-fcgi/.
version: 1
description: LMDB model across environments - concurrent writers
host: afwfcgi
afwfcgi:
  threads: 4
timeout_s: 120
parameters:
  opposite_order_skip:
    default: false
    tsan: true
    description: >-
      Skip the steps that write two LMDB environments in opposite orders.
      TSan reports that lock order (two LMDB writer mutexes) even though
      the LMDB write wait graph refuses the wait that would close the
      cycle; expected, see beta-backlog.md (TSan findings).

feed:
  kind: action
  accept: application/json
tests:
  - name: ab
    description: lmdbA (model begin_transaction), then lmdbB (onAddObject). A refusal is a pass.
    sourceType: script
    source: |
      try {
          add_object("model", "Order", {item: "order"}, generate_uuid());
      }
      catch (e) {
          if (!includes<string>(e.message, "would deadlock")) {
              throw e;
          }
      }
      return true;
    expect: true

  - name: ab-only
    description: lmdbA, then lmdbB, with no opposite-order writers around.
    sourceType: script
    source: |
      add_object("model", "Order", {item: "order"}, generate_uuid());
      return true;
    expect: true

  - name: ba
    description: lmdbB first, then lmdbA through the model. A refusal is a pass.
    skip: $opposite_order_skip
    sourceType: script
    source: |
      try {
          const id = generate_uuid();
          add_object("lmdbB", "Audit", {op: "pre", orderId: id}, id + "-pre");
          add_object("model", "Order", {item: "order"}, id);
      }
      catch (e) {
          if (!includes<string>(e.message, "would deadlock")) {
              throw e;
          }
      }
      return true;
    expect: true

  - name: via-a
    description: Write through lmdbA alone.
    sourceType: script
    source: |
      add_object("lmdbA", "AliasRow", {via: "lmdbA"}, generate_uuid());
      return true;
    expect: true

  - name: via-a2
    description: Write through lmdbA2 alone; it shares lmdbA's MDB_env and writer mutex.
    sourceType: script
    source: |
      add_object("lmdbA2", "AliasRow", {via: "lmdbA2"}, generate_uuid());
      return true;
    expect: true

  - name: hold-a-then-b
    description: >-
      Write lmdbA, hold it about half a second, then write lmdbB. Runs
      next to hold-b-then-a, so one of the two must be refused. The
      refused one records it in the environment it already holds.
    skip: $opposite_order_skip
    sourceType: script
    source: |
      add_object("lmdbA", "Pair", {by: "a-then-b"}, "a-then-b");
      const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT0.5S"));
      // A body of its own: each iteration's scope frees its now_utc().
      while (true) {
          const now = now_utc();
          if (now >= until) { break; }
      }
      try {
          add_object("lmdbB", "Pair", {by: "a-then-b"}, "a-then-b");
      }
      catch (e) {
          assert(includes<string>(e.message, "would deadlock"), e.message);
          add_object("lmdbA", "Refused", {by: "a-then-b"}, "a-then-b");
      }
      return true;
    expect: true

  - name: hold-b-then-a
    description: The mirror of hold-a-then-b.
    skip: $opposite_order_skip
    sourceType: script
    source: |
      add_object("lmdbB", "Pair", {by: "b-then-a"}, "b-then-a");
      const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT0.5S"));
      // A body of its own: each iteration's scope frees its now_utc().
      while (true) {
          const now = now_utc();
          if (now >= until) { break; }
      }
      try {
          add_object("lmdbA", "Pair", {by: "b-then-a"}, "b-then-a");
      }
      catch (e) {
          assert(includes<string>(e.message, "would deadlock"), e.message);
          add_object("lmdbB", "Refused", {by: "b-then-a"}, "b-then-a");
      }
      return true;
    expect: true

  - name: hold-for-restart
    description: Write lmdbA, hold it about a second, write lmdbB and lmdbA again.
    sourceType: script
    source: |
      add_object("lmdbA", "HoldRow", {at: "start"}, "hold-1");
      const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT1S"));
      while (true) {
          const now = now_utc();
          if (now >= until) { break; }
      }
      add_object("lmdbB", "HoldRow", {at: "middle"}, "hold-2");
      add_object("lmdbA", "HoldRow", {at: "end"}, "hold-3");
      return true;
    expect: true

  - name: restart-while-held
    description: >-
      Restart lmdbA while hold-for-restart holds its writer mutex. The new
      instance's start-up write waits for that request to end, then the
      restart completes; neither request blocks the other for good.
    sourceType: script
    source: |
      const until = add_dayTimeDuration<dateTime>(now_utc(), dayTimeDuration("PT0.3S"));
      while (true) {
          const now = now_utc();
          if (now >= until) { break; }
      }
      return service_restart("adapter-lmdbA").status;
    expect: running

  - name: check-hold
    sourceType: script
    source: |
      return [length(retrieve_objects("lmdbA", "HoldRow")),
          length(retrieve_objects("lmdbB", "HoldRow"))];
    expect: [2, 1]

  - name: check-orders-1
    description: Every Order has its OrderRow in lmdbA and its Audit in lmdbB.
    sourceType: script
    source: |
      const rows = length(retrieve_objects("lmdbA", "OrderRow"));
      const adds = length(retrieve_objects("lmdbB", "Audit",
          {filter: {op: "eq", property: "op", value: "add"}}));
      assert(rows === adds, string(rows) + " OrderRow, " + string(adds) + " Audit");
      return rows;
    expect: 96

  - name: check-orders-2
    description: Still one Audit per OrderRow after the mixed-order phase; refused requests added neither.
    sourceType: script
    source: |
      const rows = length(retrieve_objects("lmdbA", "OrderRow"));
      const adds = length(retrieve_objects("lmdbB", "Audit",
          {filter: {op: "eq", property: "op", value: "add"}}));
      assert(rows === adds, string(rows) + " OrderRow, " + string(adds) + " Audit");
      assert(rows > 96 && rows <= 192, string(rows) + " OrderRow");
      return true;
    expect: true

  - name: check-alias
    description: Both ids see every AliasRow, from either id.
    sourceType: script
    source: |
      const viaA = length(retrieve_objects("lmdbA", "AliasRow"));
      const viaA2 = length(retrieve_objects("lmdbA2", "AliasRow"));
      return [viaA, viaA2];
    expect: [96, 96]

  - name: check-pair
    description: Exactly one of the two holders was refused; the other wrote both environments.
    skip: $opposite_order_skip
    sourceType: script
    source: |
      const refused = length(retrieve_objects("lmdbA", "Refused"))
          + length(retrieve_objects("lmdbB", "Refused"));
      const pairs = length(retrieve_objects("lmdbA", "Pair"))
          + length(retrieve_objects("lmdbB", "Pair"));
      return [refused, pairs];
    expect: [1, 3]

schedule:
  - firehose:
      maxRequests: 96
      concurrency: 8
      fromTests: [ab-only]
      policy: roundRobin
      seed: 3
      stopOnError: false
      maxFail: 0
  - sequential: [check-orders-1]
  - firehose:
      maxRequests: 96
      concurrency: 8
      fromTests: [via-a, via-a2]
      policy: roundRobin
      seed: 5
      stopOnError: false
      maxFail: 0
  - sequential: [check-alias]
  - parallel:
      n: 2
      tests: [hold-a-then-b, hold-b-then-a]
  - sequential: [check-pair]
  - parallel:
      n: 2
      tests: [hold-for-restart, restart-while-held]
  - sequential: [check-hold]
  - firehose:
      maxRequests: 96
      concurrency: 8
      fromTests: [ab, ba]
      policy: random
      seed: 7
      stopOnError: false
      maxFail: 0
  - sequential: [check-orders-2]
