# An index_create that fails during its retroactive scan must not leave
# the adapter's transaction open (#500). Needs afwfcgi: in one afw
# process the next call reuses the session and its open transaction,
# so the leak only shows on the next request on the same thread.
#
# add          one object of type Idx, so the retroactive scan has work.
# bad-retro    index_create with retroactive true and an index value
#              that does not parse. The error is caught and checked.
# add-after    another write on the same (only) server thread.
#
# Pass: all three answer. Before the fix, afw_adapter_impl_index_create
# did not release the transaction it began for the retroactive scan
# when the scan threw. The LMDB write transaction and the adapter's
# dbLock stayed held, so add-after (and every later write) waited
# forever and the leaf failed on timeout_s.
version: 1
description: LMDB index_create error during retroactive scan releases its transaction
host: afwfcgi
afwfcgi:
  threads: 1
timeout_s: 30
feed:
  kind: action
  accept: application/json
tests:
  - name: add
    sourceType: script
    source: |
      add_object("lmdb", "Idx", {t: "V1"});
      return true;
    expect: true

  - name: bad-retro
    sourceType: script
    source: |
      try {
          index_create("lmdb", "t", "(", ["Idx"], undefined, undefined, true, false);
      }
      catch (e) {
          return includes<string>(e.message, "Parse error");
      }
      return false;
    expect: true

  - name: add-after
    sourceType: script
    source: |
      add_object("lmdb", "Idx", {t: "V2"});
      return length(retrieve_objects("lmdb", "Idx"));
    expect: 2

schedule:
  - sequential: [add, bad-retro, add-after]
